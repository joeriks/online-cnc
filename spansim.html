te (F) is undefined`,"err.23":`Command requires an integer value`,"err.24":`Two commands on the line want to use the axis words`,"err.25":`The same word appears twice on the line`,"err.26":`Axis words missing for the command`,"err.27":`Invalid line number (N)`,"err.28":`A required value is missing (e.g. P for G4)`,"err.29":`Coordinate system not supported`,"err.30":`G53 requires G0 or G1 to be active`,"err.31":`Axis words without a motion command (G80 active)`,"err.32":`The arc has no axis words in the selected plane`,"err.33":`Invalid target – the arc cannot be computed`,"err.34":`Arc radius (R) does not fit the start and end points`,"err.35":`IJK offset missing in the selected plane`,"err.36":`Unused words on the line`,"err.37":`Tool length offset (G43.1) may only have Z`,"err.38":`Tool number greater than 255`,"errd.after":`after {l}`,"errd.axes":`{l} word (the machine has three axes)`,"errd.probe":`G{v} (probing is not simulated)`,"errd.g901":`G90.1 – GRBL only supports incremental IJK (G91.1)`,"errd.m6":`M6 – enable tool change in the machine settings`,"errd.negF":`negative F`,"errd.negS":`negative S`,"errd.g4P":`P missing for G4`,"errd.g10":`G10 requires L and P`,"errd.g431":`G43.1 without Z`,"errd.g92":`G92 without axis words`,"errd.rSame":`R arc to the same point`,"errd.radius":`radius differs by {d} mm`,"note.home":`$H: the machine homes to its home position.`,"note.skip":`{cmd} does not affect motion and is skipped in the simulation.`,"alarm.soft":`Soft limit: line {line} wants to move outside the work area ({where}). GRBL detects this when the line is planned and stops the machine immediately – {blocks} blocks before the target.`,"alarm.hard":`Hard limit: the machine hit a limit switch on line {line} ({where}). GRBL stops all motors at once, position is lost and the machine must be homed ($H).`,"axis.outside":`machine coordinate {parts}`,"ev.spindleOn":`Spindle {m} {rpm} rpm`,"ev.spindleOff":`Spindle off (M5)`,"ev.dwell":`Waiting {s} s (G4)`,"ev.tool":`To ute length ({len} mm) by {d} mm. The shank rubs, heats up and the tool breaks easily.`,"w.SHANK.fix":`Use a tool with at least {need} mm flute length, or clear a wider pocket first so the shank runs free.`,"w.RAPID_CUT.title":`Rapid move (G0) through material`,"w.RAPID_CUT.detail":`G0 runs at {rate} mm/min straight through the stock – a crash.`,"w.RAPID_CUT.fix":`Add G0 Z{z} (3 mm above the stock) before the move on line {line}, or change G0 to G1 with a feed if the tool is meant to cut.`,"w.SPINDLE_OFF.title":`Cutting with a stopped spindle`,"w.SPINDLE_OFF.detailOn":`The spindle is on but its speed is 0 (S missing or S0). The tool is pushed into the material and breaks.`,"w.SPINDLE_OFF.detailOff":`M3 is missing – the spindle is not turning when the tool enters the material. The tool breaks.`,"w.SPINDLE_OFF.fix":`Add M3 S{rpm} followed by G4 P{p} before the first cut.`,"w.LOST_STEPS.title":`Lost steps on the {axes} axis`,"w.LOST_STEPS.detail":`The cutting force (≈{f} N) is more than the stepper motor can handle ({limits}). The motor skips steps, the machine loses its position and the rest of the program ends up offset.`,"w.ROUTER_S.title":`The S value does not affect the trim router`,"w.ROUTER_S.detail":`The program asks for {rpm} rpm but the router runs at the dial setting: {dial} rpm. M3/M5 only switch it on and off (via a relay).`,"w.ROUTER_S.fix":`Turn the dial to ≈{rpm} rpm, or change the dial speed under Machine so the simulation matches reality.`,"w.S_MAX.title":`Spindle speed is limited`,"w.S_MAX.detail":`S{s} is higher than the spindle maximum ({max} rpm, $30).`,"w.S_MAX.fix":`Lower to S{max} and multiply the feed by {k} to keep the chip load.`,"w.S_ZERO.title":`Spindle started without a speed`,"w.S_ZERO.detail":`M3 without an S value (or S0) gives 0 % PWM – the spindle does not turn.`,"w.S_ZERO.fix":`Write M3 S{rpm} on line {line}.`,"w.TC_SPINDLE.title":`Spindle running during tool change`,"w.TC_SPINDLE.detail":`GRBL does not stop the spindle at M6.`,"w.TC_SPINDLE.fix":`Add M5 before T{n} M6, and M3 S… + G4 P… after the change.`,"w.NO_TOOL.title":`T{n} is not in the tool table`,"w.NO_TOOL.detail":`The simulation continues with the previous tool.`,"w.NO_TOOL.fix":`Add T{n} under the Tools tab.`,"chip.range":`The chip thickness is {h} mm (recommended {a}–{b} for Ø{d} in {mat})`,"adv.accel":`The machine only reaches ≈{v} mm/min of F{f} over the short distance (acceleration {a} mm/s², $120). Longer moves or a lower spindle speed help.`,"adv.maxS":`The machine can do at most {max} mm/min – lower the spindle speed to ≈S{s} instead.`,"adv.maxDial":`The machine can do at most {max} mm/min – turn down the router’s speed dial.`,"adv.feedLow":`Try F≈{f} or lower the spindle speed.`,"adv.feedHigh":`Try F≈{f} or raise the spindle speed.`,"w.PLUNGE_SLOW.title":`Very slow plunge`,"w.PLUNGE_SLOW.detail":`The chip thickness when plunging is {h} mm per tooth. The tip rubs and heats up – a ramp or helix cuts cleaner and takes less time.`,"w.PLUNGE_SLOW.fix":`Raise the plunge rate to ≈F{f}, or ramp in at 2–5° with G1 X/Y/Z together.`,"w.PLUNGE_FAST.title":`Plunging too fast`,"w.PLUNGE_FAST.detail":`The chip thickness when plunging is {h} mm per tooth (max ≈{max}). The center of the cutting edge cannot take that.`,"w.PLUNGE_FAST.fix":`Lower the plunge rate to ≈F{f}, or ramp in at 2–5°.`,"w.MELT.title":`Risk of the plastic melting`,"w.MELT.detail":`{range}. Thin chips don’t carry the heat away – the plastic melts and welds to the tool.`,"w.CHIP_LOW_METAL.title":`Chips too thin – the edge rubs`,"w.CHIP_LOW_METAL.detail":`{range}. The metal sticks to the edge and the tool wears quickly.`,"w.CHIP_LOW.title":`Chips too thin – risk of burn marks`,"w.CHIP_LOW.detail":`{range}. The edge rubs instead of cutting.`,"w.CHIP_HIGH.title":`Chips too thick`,"w.CHIP_HIGH.detail":`{range}. The edge is overloaded and can chip.`,"fix.or":`, or `,"fix.plungeFeed":`lower the plunge rate to F{f} (now F{now})`,"fix.ramp":`ramp in at 2–5° instead of plunging straight down`,"fix.ap":`reduce the depth per pass to {v} mm (now ≈{now} mm)`,"fix.slot":`use a stepover of ≈{v} mm instead of a full slot (adaptive or trochoidal path)`,"fix.ae":`reduce the stepover to {v} mm (now ≈{now} mm)`,"fix.feed":`lower the feed to F{f} (now F{now})`,"fix.stickout":`A shorter stickout also helps: {n} mm instead of {now} mm.`,"fix.stickoutMin":`Shorten the stickout to {n} mm (as short as the flute length allows) or pick a larger tool.`,"fix.frame":`Most of it ({d} mm) is the frame springing (stiffness {k} N/mm) – a shorter tool hardly helps, less cutting force does.`,"fix.finish":`To hold dimensions: rough with these settings and leave 0.2–0.3 mm for a light finishing pass.`,"fix.rpmPower":`The spindle gives more power at higher speed: S{s} with F{f} gives the same chip load but {p} % available power.`,"w.SPINUP.title":`The spindle has not reached full speed`,"w.SPINUP.detail":`The tool enters the material at ≈{rpm} rpm of {target}. GRBL does not wait for the spindle to spin up.`,"w.SPINUP.fix":`Add G4 P{p} right after M3 so the spindle gets up to speed.`,"w.VC_HIGH.title":`Cutting speed too high`,"w.VC_HIGH.detail":`vc ≈ {vc} m/min, max ≈ {max} m/min for {tm} in {mat}. The edge gets too hot.`,"w.VC_HIGH.fix":`Lower the spindle speed to ≈S{s} and the feed to ≈F{f} (same chip load).`,"w.POWER_OVER.title":`The spindle is overloaded and loses speed`,"w.POWER_NEAR.title":`The spindle runs close to max power`,"w.POWER.detail":`The cut needs ≈{p} W but the spindle gives {avail} W at {rpm} rpm ({load} %).`,"w.STALL.title":`The spindle stalls`,"w.STALL.detail":`The power needed is {load} % of what the spindle can deliver. The spindle stops in the cut and the tool breaks.`,"w.DEFLECT.title":`Tool and machine deflect`,"w.DEFLECT.detail":`Deflection ≈{d} mm (tool {dt} + machine {dm}) at ≈{f} N. Causes dimensional errors and a risk of vibration (chatter).`,"w.BREAK.title":`The tool breaks`,"w.BREAK.detail":`The bending stress in the tool is {p} % of the breaking limit (force ≈{f} N, stickout {l} mm).`,"w.BREAK_RISK.title":`High risk of breaking the tool`,"w.BREAK_RISK.detail":`The bending stress is {p} % of the breaking limit (force ≈{f} N).`,"w.PLUNGE_NC.title":`Plunging with a tool that does not cut at the center`,"w.PLUNGE_NC.detail":`The tool cannot drill straight down.`,"w.PLUNGE_NC.fix":`Ramp in at 2–5° or helix down (G2/G3 with Z), or start outside the stock.`,"w.STARVE.title":`The planner buffer starves – the machine stutters`,"w.STARVE.detail":`{n} lines are so short that the controller cannot receive them in time ({baud} baud, ≈{ms} ms/line). Speed drops to as low as {p} % of the planned speed.`,"w.STARVE.fix":`Export with arcs (G2/G3) instead of short straight segments, raise the tolerance in CAM so segments get longer, or use a 32-bit controller (grblHAL) with a larger buffer.`,"wh.section":`Workholding`,"wh.method":`Method`,"wh.auto":`Automatic – best option`,"wh.clampsN":`Number of clamps`,"wh.viseOpening":`Vise opening`,"wh.jawHeight":`Jaw height`,"wh.hint":`Clamps, screws and vise jaws are placed automatically where the toolpath does not go. The Analysis tab compares all methods for this program.`,"wh.options":`Workholding options`,"wh.use":`Use`,"wh.inUse":`In use`,"wh.autoPicked":`In use (automatic)`,"wh.hold":`Holds ≈{hold} N · max cutting force {f} N`,"wh.rating.good":`Good`,"wh.rating.ok":`OK`,"wh.rating.bad":`Poor`,"wh.rating.na":`Not possible`,"wh.name.clamps":`Strap clamps`,"wh.name.screws":`Screws in the waste border`,"wh.name.vise":`Machine vise`,"wh.name.tape":`Double-sided tape`,"wh.name.glue":`Painter’s tape + CA glue`,"wh.name.vacuum":`Vacuum table`,"wh.desc.clamps":`Steel straps with M8 bolts into T-slots or threaded inserts, placed where the path does not go. Very strong, but they stick up above the stock.`,"wh.desc.screws":`Wood screws through the waste border into the spoilboard. Low profile and strong, but needs a border of waste material.`,"wh.desc.vise":`The stock is clamped between two jaws. Quick and very strong for small, square blocks.`,"wh.desc.tape":`Double-sided carpet tape over the whole underside. Nothing to hit and it holds parts that are cut free, but it is weak against large forces.`,"wh.desc.glue":`Painter’s tape on both the stock and the spoilboard, glued together with CA glue. Much stronger than tape and releases with a putty knife.`,"wh.desc.vacuum":`Vacuum pulls the stock against the table. Clean and quick for large sheets, but loses its grip when cuts go through.`,"wh.i.thin":`Thin, large sheet: clamps only hold the edges – the middle can lift and vibrate. Add screws or tape in the middle.`,"wh.i.shallow":`The jaws only grip {e} mm of the stock.`,"wh.i.tipping":`Tall stock on a small base can tip over from the cutting force.`,"wh.i.leak":`Through cuts leak air – the vacuum loses about {pct} % of its grip. Use an MDF bleeder board or leave an onion skin.`,"wh.i.small":`Small stock: little area for the vacuum to pull on.`,"wh.i.na.metal":`Screws cannot be used in metal.`,"wh.i.na.noroom":`No room for screws: the path reaches the whole border.`,"wh.i.na.wide":`The stock is wider than the vise opening in both directions.`,"wh.i.na.thin":`Too thin to hold in a vise.`,"wh.i.hit":`The {part} hits the {obj} on line {line}.`,"wh.i.hitRapid":`The {part} hits the {obj} on line {line} during a travel move. Raise the safe height to at least Z{z}.`,"wh.i.loose":`A piece ({a} cm²) is cut free and nothing holds it – it can be thrown out or break the tool.`,"wh.i.looseWeak":`A piece ({a} cm²) is cut free and is only held weakly.`,"wh.i.weak":`Holds only ≈{hold} N against cutting forces up to {f} N (at least 4× margin is recommended).`,"wh.part.cutter":`cutter`,"wh.part.shank":`tool shank`,"wh.part.nut":`collet nut`,"wh.part.spindle":`spindle`,"wh.obj.clamp":`clamp`,"wh.obj.screw":`screw`,"wh.obj.vise":`vise jaw`,"ev.breakFixture":`Tool T{n} broke against the {obj} on line {line}`,"ev.crashFixture":`The spindle crashes into the {obj} on line ute length ({len} mm) by {d} mm. The shank rubs, heats up and the tool breaks easily.`,"w.SHANK.fix":`Use a tool with at least {need} mm flute length, or clear a wider pocket first so the shank runs free.`,"w.RAPID_CUT.title":`Rapid move (G0) through material`,"w.RAPID_CUT.detail":`G0 runs at {rate} mm/min straight through the stock – a crash.`,"w.RAPID_CUT.fix":`Add G0 Z{z} (3 mm above the stock) before the move on line {line}, or change G0 to G1 with a feed if the tool is meant to cut.`,"w.SPINDLE_OFF.title":`Cutting with a stopped spindle`,"w.SPINDLE_OFF.detailOn":`The spindle is on but its speed is 0 (S missing or S0). The tool is pushed into the material and breaks.`,"w.SPINDLE_OFF.detailOff":`M3 is missing – the spindle is not turning when the tool enters the material. The tool breaks.`,"w.SPINDLE_OFF.fix":`Add M3 S{rpm} followed by G4 P{p} before the first cut.`,"w.LOST_STEPS.title":`Lost steps on the {axes} axis`,"w.LOST_STEPS.detail":`The cutting force (≈{f} N) is more than the stepper motor can handle ({limits}). The motor skips steps, the machine loses its position and the rest of the program ends up offset.`,"w.ROUTER_S.title":`The S value does not affect the trim router`,"w.ROUTER_S.detail":`The program asks for {rpm} rpm but the router runs at the dial setting: {dial} rpm. M3/M5 only switch it on and off (via a relay).`,"w.ROUTER_S.fix":`Turn the dial to ≈{rpm} rpm, or change the dial speed under Machine so the simulation matches reality.`,"w.S_MAX.title":`Spindle speed is limited`,"w.S_MAX.detail":`S{s} is higher than the spindle maximum ({max} rpm, $30).`,"w.S_MAX.fix":`Lower to S{max} and multiply the feed by {k} to keep the chip load.`,"w.S_ZERO.title":`Spindle started without a speed`,"w.S_ZERO.detail":`M3 without an S value (or S0) gives 0 % PWM – the spindle does not turn.`,"w.S_ZERO.fix":`Write M3 S{rpm} on line {line}.`,"w.TC_SPINDLE.title":`Spindle running during tool change`,"w.TC_SPINDLE.detail":`GRBL does not stop the spindle at M6.`,"w.TC aking limit (force ≈{f} N, stickout {l} mm).`,"w.BREAK_RISK.title":`High risk of breaking the tool`,"w.BREAK_RISK.detail":`The bending stress is {p} % of the breaking limit (force ≈{f} N).`,"w.PLUNGE_NC.title":`Plunging with a tool that does not cut at the center`,"w.PLUNGE_NC.detail":`The tool cannot drill straight down.`,"w.PLUNGE_NC.fix":`Ramp in at 2–5° or helix down (G2/G3 with Z), or start outside the stock.`,"w.STARVE.title":`The planner buffer starves – the machine stutters`,"w.STARVE.detail":`{n} lines are so short that the controller cannot receive them in time ({baud} baud, ≈{ms} ms/line). Speed drops to as low as {p} % of the planned speed.`,"w.STARVE.fix":`Export with arcs (G2/G3) instead of short straight segments, raise the tolerance in CAM so segments get longer, or use a 32-bit controller (grblHAL) with a larger buffer.`,"wh.section":`Workholding`,"wh.method":`Method`,"wh.auto":`Automatic – best option`,"wh.clampsN":`Number of clamps`,"wh.viseOpening":`Vise opening`,"wh.jawHeight":`Jaw height`,"wh.hint":`Clamps, screws and vise jaws are placed automatically where the toolpath does not go. The Analysis tab compares all methods for this program.`,"wh.options":`Workholding options`,"wh.use":`Use`,"wh.inUse":`In use`,"wh.autoPicked":`In use (automatic)`,"wh.hold":`Holds ≈{hold} N · max cutting force {f} N`,"wh.rating.good":`Good`,"wh.rating.ok":`OK`,"wh.rating.bad":`Poor`,"wh.rating.na":`Not possible`,"wh.name.clamps":`Strap clamps`,"wh.name.screws":`Screws in the waste border`,"wh.name.vise":`Machine vise`,"wh.name.tape":`Double-sided tape`,"wh.name.glue":`Painter’s tape + CA glue`,"wh.name.vacuum":`Vacuum table`,"wh.desc.clamps":`Steel straps with M8 bolts into T-slots or threaded inserts, placed where the path does not go. Very strong, but they stick up above the stock.`,"wh.desc.screws":`Wood screws through the waste border into the spoilboard. Low profile and strong, but needs a border of waste material.`,"wh.desc.vise":`The stock is clamped betwee   </head>
  <body>
    <div class="app" id="app">
      <header class="topbar">
        <div class="brand">
          <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
            <path d="M9 3h14v4H9z" fill="currentColor" opacity=".55" />
            <path d="M12 7h8v8l-4 3-4-3z" fill="currentColor" />
            <path d="M15 18h2v5l-1 2-1-2z" fill="currentColor" />
            <path d="M3 27c4-3 7 1 10-1s5-3 8-1 5 2 8 0" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" />
          </svg>
          <div>
            <div class="brand-name">Spånsim</div>
            <div class="brand-sub" data-i18n="app.sub">Hobby CNC simulator · GRBL 1.1</div>
          </div>
        </div>
        <div class="top-actions">
          <label class="sr-only" for="example-select" data-i18n="app.examples">Example programs…</label>
          <select id="example-select" class="select">
            <option value="" data-i18n="app.examples">Example programs…</option>
          </select>
          <label class="btn btn-ghost" for="file-input" data-i18n="app.open">Open file</label>
          <input type="file" id="file-input" accept=".nc,.gcode,.ngc,.tap,.txt,.cnc,.gc,.nc1" hidden />
          <button class="btn btn-primary" id="run-btn" type="button">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.5v11l9-5.5z" fill="currentColor" /></svg>
            <span data-i18n="app.simulate">Simulate</span>
          </button>
          <span class="status-chip" id="status-chip" data-state="idle" data-i18n="status.idle">Not run</span>
          <label class="sr-only" for="lang-select" data-i18n="app.language">Language</label>
          <select id="lang-select" class="select select-lang" title="Language / Språk">
            <option value="en">EN</option>
            <option value="sv">SV</option>
          </select>
        </div>
      </header>

      <section class="pane editor-pane" data-i18n-aria="editor.aria" aria-label="G-code">
        <div class="pane-head">
          <h2 data-i18n="editor.title">Program</h2>
          <span class="pane-meta" id="editor-meta"></span>
        </div>
        <div class="editor" id="editor">
          <div class="gutter" id="gutter" aria-hidden="true"><div class="gutter-inner" id="gutter-inner"></div></div>
          <div class="code-wrap">
            <div class="line-hl" id="line-hl" hidden></div>
            <textarea id="code" spellcheck="false" autocomplete="off" autocapitalize="off" wrap="off" data-i18n-aria="editor.aria" aria-label="G-code"></textarea>
          </div>
        </div>
        <div class="editor-foot" id="editor-foot"></div>
      </section>

      <section class="stage" data-i18n-aria="stage.aria" aria-label="Simulation">
        <div class="viewport" id="viewport">
          <div class="dro" id="dro" aria-live="off">
            <div class="dro-state"><span class="state-pill" id="dro-state">Idle</span><span id="dro-line">Line –</span></div>
            <table class="dro-table">
              <thead><tr><th></th><th data-i18n="dro.work">Work</th><th data-i18n="dro.machine">Machine</th></tr></thead>
              <tbody>
                <tr><th>X</th><td id="dro-wx">0.000</td><td id="dro-mx">0.000</td></tr>
                <tr><th>Y</th><td id="dro-wy">0.000</td><td id="dro-my">0.000</td></tr>
                <tr><th>Z</th><td id="dro-wz">0.000</td><td id="dro-mz">0.000</td></tr>
              </tbody>
            </table>
            <div class="dro-row"><span>F</span><b id="dro-f">0</b><span class="unit">mm/min</span></div>
            <div class="dro-row"><span>S</span><b id="dro-s">0</b><span class="unit">rpm</span></div>
            <div class="dro-row"><span>T</span><b id="dro-t">–</b></div>
            <div class="load-meter" data-i18n-title="dro.loadTitle" title="Spindle load"><div class="load-fill" id="load-fill"></div><span id="load-text"></span></div>
          </div>
          <div class="view-tools" role="toolbar" data-i18n-aria="view.aria" aria-label="View">
            <button type="button" class="chip" data-view="iso" data-i18n="view.iso">3D</button>
            <button type="button" class="chip" data-view="top" data-i18n="view.top">Top</button>
            <button type="button" class="chip" data-view="front" data-i18n="view.front">Front</button>
            <button type="button" class="chip" data-view="side" data-i18n="view.side">Side</button>
            <span class="sep"></span>
            <button type="button" class="chip chip-result" id="result-btn" aria-pressed="false" data-i18n="view.result" data-i18n-title="view.resultTitle" title="Show only the finished part">Result</button>
            <label class="chip toggle"><input type="checkbox" id="show-paths" checked /> <span data-i18n="view.paths">Paths</span></label>
            <label class="chip toggle"><input type="checkbox" id="show-rapids" checked /> <span data-i18n="view.rapids">G0</span></label>
            <label class="chip toggle"><input type="checkbox" id="show-machine" checked /> <span data-i18n="view.machine">Machine</span></label>
          </div>
          <div class="banner" id="banner" hidden></div>
          <div class="busy" id="busy" hidden><div class="busy-bar"><div id="busy-fill"></div></div><span data-i18n="busy.text">Simulating…</span></div>
        </div>
        <div class="transport" id="transport">
          <button type="button" class="icon-btn" id="rewind-btn" data-i18n-title="tr.rewind" data-i18n-aria="tr.rewind" title="To start (Home)" aria-label="To start">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 3h2v10H3zM14 3v10L6 8z" fill="currentColor" /></svg>
          </button>
          <button type="button" class="icon-btn play" id="play-btn" data-i18n-title="tr.play" title="Play/pause (space)" aria-label="Start">
            <svg viewBox="0 0 16 16" aria-hidden="true" class="i-play"><path d="M4 2.5v11l9-5.5z" fill="currentColor" /></svg>
            <svg viewBox="0 0 16 16" aria-hidden="true" class="i-pause"><path d="M4 3h3v10H4zM9 3h3v10H9z" fill="currentColor" /></svg>
          </button>
          <button type="button" class="icon-btn" id="end-btn" data-i18n-title="tr.end" data-i18n-aria="tr.end" title="To end (End)" aria-label="To end">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M11 3h2v10h-2zM2 3v10l8-5z" fill="currentColor" /></svg>
          </button>
          <label class="sr-only" for="speed" data-i18n="tr.speed">Speed</label>
          <select id="speed" class="select select-sm">
            <option value="1">1×</option>
            <option value="2">2×</option>
            <option value="5">5×</option>
            <option value="10" selected>10×</option>
            <option value="25">25×</option>
            <option value="60">60×</option>
            <option value="200">200×</option>
            <option value="1000">1000×</option>
          </select>
          <input type="range" id="timeline" min="0" max="1000" value="0" step="1" data-i18n-aria="tr.timeline" aria-label="Timeline" />
          <span class="time" id="time-label">0:00 / 0:00</span>
          <label class="chip toggle small"><input type="checkbox" id="stop-at-pause" checked /> <span data-i18n="tr.stopAtPause">Stop at M0/M6</span></label>
        </div>
      </section>

      <aside class="pane side-pane" data-i18n-aria="side.aria" aria-label="Settings and analysis">
        <div class="tabs" role="tablist">
          <button role="tab" type="button" class="tab" data-tab="analysis" aria-selected="true">Analysis</button>
          <button role="tab" type="button" class="tab" data-tab="machine" aria-selected="false" data-i18n="tab.machine">Machine</button>
          <button role="tab" type="button" class="tab" data-tab="tools" aria-selected="false" data-i18n="tab.tools">Tools</button>
          <button role="tab" type="button" class="tab" data-tab="stock" aria-selected="false" data-i18n="tab.stock">Material</button>
        </div>
        <div class="tab-panels">
          <section class="tab-panel" id="tab-analysis" role="tabpanel"></section>
          <section class="tab-panel" id="tab-machine" role="tabpanel" hidden></section>
          <section class="tab-panel" id="tab-tools" role="tabpanel" hidden></section>
          <section class="tab-panel" id="tab-stock" role="tabpanel" hidden></section>
        </div>
      </aside>
    </div>
  </body>
</html>
