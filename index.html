<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Spånsim</title>
    <meta name="description" content="Hobby CNC simulator for GRBL: test G-code with different tools and materials before you cut." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap" />
  </head>
  <body>
    <div class="app" id="app">
      <header class="topbar">
        <div class="brand">
          <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
            <path d="M9 3h14v4H9z" fill="currentColor" opacity=".55" />
            <path d="M12 7h8v8l-4 3-4-3z" fill="currentColor" />
            <path d="M15 18h2v5l-1 2-1-2z" fill="currentColor" />
            <path d="M3 27c4-3 7 1 10-1s5-3 8-1 5 2 8 0" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" />
          </svg>
          <div>
            <div class="brand-name">Spånsim</div>
            <div class="brand-sub" data-i18n="app.sub">Hobby CNC simulator · GRBL 1.1</div>
          </div>
        </div>
        <div class="top-actions">
          <label class="sr-only" for="example-select" data-i18n="app.examples">Example programs…</label>
          <select id="example-select" class="select">
            <option value="" data-i18n="app.examples">Example programs…</option>
          </select>
          <label class="btn btn-ghost" for="file-input" data-i18n="app.open">Open file</label>
          <input type="file" id="file-input" accept=".nc,.gcode,.ngc,.tap,.txt,.cnc,.gc,.nc1" hidden />
          <button class="btn btn-primary" id="run-btn" type="button">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.5v11l9-5.5z" fill="currentColor" /></svg>
            <span data-i18n="app.simulate">Simulate</span>
          </button>
          <span class="status-chip" id="status-chip" data-state="idle" data-i18n="status.idle">Not run</span>
          <label class="sr-only" for="skin-select" data-i18n="app.skin">Theme</label>
          <select id="skin-select" class="select select-lang" data-i18n-title="app.skin" title="Theme">
            <option value="workshop" data-i18n="skin.workshop">Workshop</option>
            <option value="aero" data-i18n="skin.aero">Aero</option>
          </select>
          <label class="sr-only" for="lang-select" data-i18n="app.language">Language</label>
          <select id="lang-select" class="select select-lang" title="Language / Språk">
            <option value="en">EN</option>
            <option value="sv">SV</option>
          </select>
        </div>
      </header>

      <section class="pane editor-pane" data-i18n-aria="editor.aria" aria-label="G-code">
        <div class="pane-head">
          <h2 data-i18n="editor.title">Program</h2>
          <span class="pane-meta" id="editor-meta"></span>
        </div>
        <div class="editor" id="editor">
          <div class="gutter" id="gutter" aria-hidden="true"><div class="gutter-inner" id="gutter-inner"></div></div>
          <div class="code-wrap">
            <div class="line-hl" id="line-hl" hidden></div>
            <textarea id="code" spellcheck="false" autocomplete="off" autocapitalize="off" wrap="off" data-i18n-aria="editor.aria" aria-label="G-code"></textarea>
          </div>
        </div>
        <div class="editor-foot" id="editor-foot"></div>
      </section>

      <section class="stage" data-i18n-aria="stage.aria" aria-label="Simulation">
        <div class="viewport" id="viewport">
          <div class="dro" id="dro" aria-live="off">
            <div class="dro-state"><span class="state-pill" id="dro-state">Idle</span><span id="dro-line">Line –</span></div>
            <table class="dro-table">
              <thead><tr><th></th><th data-i18n="dro.work">Work</th><th data-i18n="dro.machine">Machine</th></tr></thead>
              <tbody>
                <tr><th>X</th><td id="dro-wx">0.000</td><td id="dro-mx">0.000</td></tr>
                <tr><th>Y</th><td id="dro-wy">0.000</td><td id="dro-my">0.000</td></tr>
                <tr><th>Z</th><td id="dro-wz">0.000</td><td id="dro-mz">0.000</td></tr>
              </tbody>
            </table>
            <div class="dro-row"><span>F</span><b id="dro-f">0</b><span class="unit">mm/min</span></div>
            <div class="dro-row"><span>S</span><b id="dro-s">0</b><span class="unit">rpm</span></div>
            <div class="dro-row"><span>T</span><b id="dro-t">–</b></div>
            <div class="load-meter" data-i18n-title="dro.loadTitle" title="Spindle load"><div class="load-fill" id="load-fill"></div><span id="load-text"></span></div>
          </div>
          <div class="view-tools" role="toolbar" data-i18n-aria="view.aria" aria-label="View">
            <button type="button" class="chip" data-view="iso" data-i18n="view.iso">3D</button>
            <button type="button" class="chip" data-view="top" data-i18n="view.top">Top</button>
            <button type="button" class="chip" data-view="front" data-i18n="view.front">Front</button>
            <button type="button" class="chip" data-view="side" data-i18n="view.side">Side</button>
            <span class="sep"></span>
            <button type="button" class="chip chip-result" id="result-btn" aria-pressed="false" data-i18n="view.result" data-i18n-title="view.resultTitle" title="Show only the finished part">Result</button>
            <label class="chip toggle"><input type="checkbox" id="show-paths" checked /> <span data-i18n="view.paths">Paths</span></label>
            <label class="chip toggle"><input type="checkbox" id="show-rapids" checked /> <span data-i18n="view.rapids">G0</span></label>
            <label class="chip toggle"><input type="checkbox" id="show-machine" checked /> <span data-i18n="view.machine">Machine</span></label>
          </div>
          <div class="banner" id="banner" hidden></div>
          <div class="busy" id="busy" hidden><div class="busy-bar"><div id="busy-fill"></div></div><span data-i18n="busy.text">Simulating…</span></div>
        </div>
        <div class="transport" id="transport">
          <button type="button" class="icon-btn" id="rewind-btn" data-i18n-title="tr.rewind" data-i18n-aria="tr.rewind" title="To start (Home)" aria-label="To start">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 3h2v10H3zM14 3v10L6 8z" fill="currentColor" /></svg>
          </button>
          <button type="button" class="icon-btn play" id="play-btn" data-i18n-title="tr.play" title="Play/pause (space)" aria-label="Start">
            <svg viewBox="0 0 16 16" aria-hidden="true" class="i-play"><path d="M4 2.5v11l9-5.5z" fill="currentColor" /></svg>
            <svg viewBox="0 0 16 16" aria-hidden="true" class="i-pause"><path d="M4 3h3v10H4zM9 3h3v10H9z" fill="currentColor" /></svg>
          </button>
          <button type="button" class="icon-btn" id="end-btn" data-i18n-title="tr.end" data-i18n-aria="tr.end" title="To end (End)" aria-label="To end">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M11 3h2v10h-2zM2 3v10l8-5z" fill="currentColor" /></svg>
          </button>
          <label class="sr-only" for="speed" data-i18n="tr.speed">Speed</label>
          <select id="speed" class="select select-sm">
            <option value="1">1×</option>
            <option value="2">2×</option>
            <option value="5">5×</option>
            <option value="10" selected>10×</option>
            <option value="25">25×</option>
            <option value="60">60×</option>
            <option value="200">200×</option>
            <option value="1000">1000×</option>
          </select>
          <input type="range" id="timeline" min="0" max="1000" value="0" step="1" data-i18n-aria="tr.timeline" aria-label="Timeline" />
          <span class="time" id="time-label">0:00 / 0:00</span>
          <label class="chip toggle small"><input type="checkbox" id="stop-at-pause" checked /> <span data-i18n="tr.stopAtPause">Stop at M0/M6</span></label>
        </div>
      </section>

      <aside class="pane side-pane" data-i18n-aria="side.aria" aria-label="Settings and analysis">
        <div class="tabs" role="tablist">
          <button role="tab" type="button" class="tab" data-tab="analysis" aria-selected="true">Analysis</button>
          <button role="tab" type="button" class="tab" data-tab="machine" aria-selected="false" data-i18n="tab.machine">Machine</button>
          <button role="tab" type="button" class="tab" data-tab="tools" aria-selected="false" data-i18n="tab.tools">Tools</button>
          <button role="tab" type="button" class="tab" data-tab="stock" aria-selected="false" data-i18n="tab.stock">Material</button>
        </div>
        <div class="tab-panels">
          <section class="tab-panel" id="tab-analysis" role="tabpanel"></section>
          <section class="tab-panel" id="tab-machine" role="tabpanel" hidden></section>
          <section class="tab-panel" id="tab-tools" role="tabpanel" hidden></section>
          <section class="tab-panel" id="tab-stock" role="tabpanel" hidden></section>
        </div>
      </aside>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
